[project]
name = "research-lab"
version = "0.1.0"
description = "Autonomous multi-agent research bench: iterate train.py to minimize val_bpb on TinyStories (byte-level) under a fixed compute budget."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "requests",
    "pyarrow",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
